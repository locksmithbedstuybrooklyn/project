<!-- Bed-Stuy Locksmith Favicon SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2040;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#bg)"/>
  
  <!-- Key bow (circular head) -->
  <circle cx="38" cy="35" r="15" fill="none" stroke="url(#key)" stroke-width="8"/>
  
  <!-- Key hole -->
  <circle cx="38" cy="35" r="5" fill="url(#bg)"/>
  
  <!-- Key shaft -->
  <rect x="49" y="31" width="26" height="8" rx="4" fill="url(#key)"/>
  
  <!-- Key teeth -->
  <rect x="61" y="39" width="5" height="8" rx="2" fill="url(#key)"/>
  <rect x="71" y="39" width="5" height="6" rx="2" fill="url(#key)"/>
  
  <!-- Shield outline (trust signal) -->
  <path d="M50 60 L50 85 Q50 88 53 90 L65 95 Q68 96 68 93 L68 73 Q68 65 65 60 Z" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.7"/>
  <path d="M50 60 L50 85 Q50 88 47 90 L35 95 Q32 96 32 93 L32 73 Q32 65 35 60 Z" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.7"/>
  <path d="M32 60 Q50 55 68 60" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
